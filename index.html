<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  (() => {
    let theme;
    try { theme = localStorage.getItem('cadence-theme'); } catch {}
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<aside class="side" id="side">
  <div class="logo"><img class="wm" src="cadence-logo.svg" alt="Cadence"><img class="wm dark-wm" src="cadence-logo-dark.svg" alt="Cadence"><img class="sy" src="favicon.svg" alt="Cadence"></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="foot">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span id="theme-label">Dark mode</span></button>
    <button class="me" data-act="name" aria-label="Edit your name"><span class="av" id="av"></span><span id="who"></span></button>
    <button class="lnk" data-act="reset">Reset demo data</button>
  </div>
</aside>
<div class="scrim" data-act="nav"></div>
<main>
  <button id="burger" class="btn ico" data-act="nav" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div id="view" tabindex="-1"></div>
</main>
<div class="overlay" id="modal" role="dialog" aria-modal="true" aria-label="Dialog"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
